# Auto-provisioned datasources for the ephemeral Grafana in this stack.
#
# Federation is OFF here, so there is a single Loki datasource pointed at the
# gigapipe reader (no X-Scope-OrgID header). The reader serves every stream the
# writer sharded into the cluster, via the unchanged `_dist` read path.
apiVersion: 1

datasources:
  - name: gigapipe-platform
    type: loki
    access: proxy
    uid: gigapipe-platform
    url: http://gigapipe-reader:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: platform

  - name: gigapipe-data
    type: loki
    access: proxy
    uid: gigapipe-data
    url: http://gigapipe-reader:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: data

  - name: gigapipe-api
    type: loki
    access: proxy
    uid: gigapipe-api
    url: http://gigapipe-reader:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: api

  - name: gigapipe-all
    type: loki
    access: proxy
    uid: gigapipe-all
    url: http://gigapipe-reader:3100
    isDefault: true
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: platform|data|api

  # Prometheus scraping the gigapipe reader/writer /metrics endpoints.
  - name: prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
