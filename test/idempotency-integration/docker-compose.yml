volumes:
  clickhousedata: {}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    container_name: clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "9000:9000"
      - "8124:8123"

  gigapipe:
    container_name: gigapipe
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_AUTH: "default:"
      CLICKHOUSE_SERVER: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: gigapipe
      CLUSTER_NAME: default
      MODE: "init_only"
      PORT: "3100"
      FEDERATED: "1"
    ports:
      - "3100:3100"