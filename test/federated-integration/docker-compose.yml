# Federated (multi-tenant) integration stack.
#
# Fully self-contained: spins up its OWN ephemeral ClickHouse (a single-node
# "cluster" named `default` with embedded Keeper), a split writer/reader
# gigapipe, a dummy app that continuously produces logs, and a Grafana Alloy
# collector that ships those logs to the writer tagged with a tenant
# (X-Scope-OrgID).
#
# FEDERATED=1 is on, so:
#   - the writer creates the federated schema (oid column + oid in the PK) and
#     rejects any push without X-Scope-OrgID;
#   - the reader only returns rows whose oid matches the query's X-Scope-OrgID.
#
# Nothing external is required — no pre-existing ClickHouse. Everything is torn
# down with `docker compose down -v`. See README.md.
#
# Run with:  docker compose up --build

x-clickhouse-env:
  &clickhouse-env # Ephemeral in-stack ClickHouse (the `clickhouse` service below).
  CLICKHOUSE_SERVER: clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_PROTO: tcp
  CLICKHOUSE_DB: gigapipe
  CLUSTER_NAME: default
  # Ruler (only actually boots in MODE=all; harmless in writer/reader).
  QRYN_RULER_ENABLED: "true"
  QRYN_RULER_POLL_INTERVAL: "1m"
  # Multi-tenant mode.
  FEDERATED: "1"

networks:
  federated:
    driver: bridge

volumes:
  applogs-platform: {}
  applogs-data: {}
  alloydata: {}
  clickhousedata: {}
  # Shared between dummy-nginx (writer) and alloy-nginx (tailer).
  nginxlogs: {}

services:
  # 0. Ephemeral ClickHouse: single-node cluster `default` with embedded Keeper.
  #    Data lives in a named volume that `down -v` removes.
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    container_name: clickhouse
    hostname: clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - clickhousedata:/var/lib/clickhouse
    networks: [federated]
    ports:
      # Native + HTTP exposed on the host for direct inspection (clickhouse-client
      # / curl :8124/ping). Container ports stay 9000/8123.
      - "9000:9000"
      - "8124:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  # 1. Ingestion layer (writer). Runs schema migrations, accepts pushes.
  gigapipe-writer:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: gigapipe:federated-integration
    container_name: gigapipe-writer
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      <<: *clickhouse-env
      MODE: writer
      PORT: "3100"
      # Flush ingested logs quickly so queries see data within ~1s.
      BULK_MAX_AGE_MS: "1000"
    networks: [federated]
    ports:
      # host:container — 0.0.0.0:3100 on the host (ingestion API).
      - "3100:3100"
    restart: unless-stopped

  # 2. Query layer (reader). Shares the image built by the writer; starts after
  #    the writer so the schema already exists (the reader does not migrate).
  gigapipe-reader:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: gigapipe:federated-integration
    pull_policy: never
    container_name: gigapipe-reader
    depends_on:
      clickhouse:
        condition: service_healthy
      gigapipe-writer:
        condition: service_started
    environment:
      <<: *clickhouse-env
      MODE: reader
      PORT: "3100"
    networks: [federated]
    ports:
      # Reader query API on host 0.0.0.0:3101.
      - "3101:3100"
    restart: unless-stopped

  # 2a. Ruler. Runs the unified binary in MODE=all so the ruler actually boots
  #     (it only starts under MODE=all — see the note on QRYN_RULER_ENABLED),
  #     alongside an in-process writer/reader. OMIT_CREATE_TABLES=true skips
  #     schema migration: the writer (service 1) already created the federated
  #     schema, and the rules table lives there too, so this service must start
  #     after the writer and never migrate itself. Shares the built image.
  gigapipe-ruler:
    build:
      context: ../..
      dockerfile: Dockerfile
    pull_policy: never
    container_name: gigapipe-ruler
    depends_on:
      clickhouse:
        condition: service_healthy
      gigapipe-writer:
        condition: service_started
    environment:
      <<: *clickhouse-env
      MODE: all
      OMIT_CREATE_TABLES: "true"
      PORT: "3100"
      QRYN_RULER_ENABLED: "true"
      QRYN_RULER_REMOTE_WRITE_URL: "http://prometheus:9090/api/v1/write"
      QRYN_RULER_REMOTE_WRITE_TIMEOUT: 10s
      QRYN_RULER_REMOTE_WRITE_TENANT: "anonymous"

    networks: [federated]
    ports:
      # Ruler (all-in-one) API on host 0.0.0.0:3102.
      - "3102:3100"
    restart: unless-stopped

  # 3. Dummy application for a platform team app: appends structured log lines to a shared volume that
  #    Alloy tails. Levels rotate info/warn/error so queries have variety.
  #    $$ escapes the $ so Docker Compose does not interpolate it; the container
  #    shell sees a single $.
  dummy-app-platform:
    image: alpine:3.21
    container_name: dummy-app-platform
    networks: [federated]
    volumes:
      - applogs-platform:/var/log/app
    command:
      - sh
      - -c
      - |
        mkdir -p /var/log/app
        i=0
        while true; do
          i=$$((i+1))
          lvl=info
          if [ $$((i % 5)) -eq 0 ]; then lvl=error; elif [ $$((i % 3)) -eq 0 ]; then lvl=warn; fi
          echo "ts=$$(date -u +%Y-%m-%dT%H:%M:%SZ) level=$$lvl service=dummy-app msg=\"request handled for platform service\" iter=$$i" >> /var/log/app/app.log
          sleep 1
        done
    restart: unless-stopped

  # 4. Dummy application for a data team app: appends structured log lines to a shared volume that
  #    Alloy tails. Levels rotate info/warn/error so queries have variety.
  #    $$ escapes the $ so Docker Compose does not interpolate it; the container
  #    shell sees a single $.
  dummy-app-data:
    image: alpine:3.21
    container_name: dummy-app-data
    networks: [federated]
    volumes:
      - applogs-data:/var/log/app
    command:
      - sh
      - -c
      - |
        mkdir -p /var/log/app
        i=0
        while true; do
          i=$$((i+1))
          lvl=info
          if [ $$((i % 5)) -eq 0 ]; then lvl=error; elif [ $$((i % 3)) -eq 0 ]; then lvl=warn; fi
          echo "ts=$$(date -u +%Y-%m-%dT%H:%M:%SZ) level=$$lvl service=dummy-app msg=\"request handled for data service\" iter=$$i" >> /var/log/app/app.log
          sleep 1
        done
    restart: unless-stopped

  # 5. Grafana Alloy for platform team: tails the dummy app's log file and ships to the writer's
  #    Loki push endpoint, tagged with tenant "platform" (X-Scope-OrgID).
  alloy-platform:
    image: grafana/alloy:latest
    container_name: alloy-logs-platform
    depends_on:
      gigapipe-writer:
        condition: service_started
    networks: [federated]
    volumes:
      - ./alloy/config-platform.alloy:/etc/alloy/config.alloy:ro
      - applogs-platform:/var/log/app:ro
      - alloydata:/var/lib/alloy/data
    ports:
      # Alloy's own debug UI on host 0.0.0.0:12345.
      - "12345:12345"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    restart: unless-stopped

  # 5a. Ephemeral Prometheus. Scrapes the reader's /metrics endpoint (where the
  #     gigapipe_request_duration_seconds histogram lives) every 5s. Storage is
  #     the container's own layer — no named volume — so `down` discards it.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      gigapipe-reader:
        condition: service_started
    networks: [federated]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Enable the remote-write receiver so the ruler can POST recording-rule
    # results to /api/v1/write (off by default in the stock image).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      # Prometheus UI/API on the standard host port 0.0.0.0:9090.
      - "9090:9090"
    restart: unless-stopped

  # 5b. Ephemeral Grafana for eyeballing the UI. Anonymous access is enabled and
  #     granted the Admin role, so http://localhost:3000 opens straight into the
  #     app with no login. All state lives in the container's tmpfs-backed layer
  #     (no named volume), so `down` wipes it. Two Loki datasources are
  #     provisioned — gigapipe-platform (default) and gigapipe-data — each
  #     pinned to its tenant via the X-Scope-OrgID header on the reader.
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      gigapipe-reader:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    networks: [federated]
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      # Grafana UI on the standard host port 0.0.0.0:3000.
      - "3000:3000"
    restart: unless-stopped

  # 6. Grafana Alloy for data team: tails the dummy app's log file and ships to the writer's
  #    Loki push endpoint, tagged with tenant "data" (X-Scope-OrgID).
  alloy-data:
    image: grafana/alloy:latest
    container_name: alloy-logs-data
    depends_on:
      gigapipe-writer:
        condition: service_started
    networks: [federated]
    volumes:
      - ./alloy/config-data.alloy:/etc/alloy/config.alloy:ro
      - applogs-data:/var/log/app:ro
      - alloydata:/var/lib/alloy/data
    ports:
      # Alloy's own debug UI on host 0.0.0.0:12345.
      - "12346:12345"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    restart: unless-stopped

  # 7. Dummy "log generator" nginx. Accepts all traffic, discards it (returns
  #    204 and proxies nowhere — effectively /dev/null), and writes one
  #    access-log line per request into per-tenant files under a shared volume.
  #    See nginx/nginx.conf for how the URL prefix maps to the tenant/log file.
  dummy-nginx:
    image: nginx:1.27-alpine
    container_name: dummy-nginx
    networks: [federated]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginxlogs:/var/log/nginx
    restart: unless-stopped

  # 8. Traffic generators. Each hits dummy-nginx on a tenant-specific path in a
  #    loop; nginx logs every request and attributes it to that tenant. They do
  #    not talk to gigapipe directly — their footprint is the nginx access log,
  #    which alloy-nginx (below) ships under the matching X-Scope-OrgID.
  #    $$ escapes the $ so Compose does not interpolate it.
  traffic-platform:
    image: curlimages/curl:8.11.1
    container_name: traffic-platform
    depends_on:
      dummy-nginx:
        condition: service_started
    networks: [federated]
    command:
      - sh
      - -c
      - |
        i=0
        while true; do
          i=$$((i+1))
          curl -s -o /dev/null "http://dummy-nginx:8080/platform/handle?iter=$$i"
          sleep 1
        done
    restart: unless-stopped

  traffic-data:
    image: curlimages/curl:8.11.1
    container_name: traffic-data
    depends_on:
      dummy-nginx:
        condition: service_started
    networks: [federated]
    command:
      - sh
      - -c
      - |
        i=0
        while true; do
          i=$$((i+1))
          curl -s -o /dev/null "http://dummy-nginx:8080/data/handle?iter=$$i"
          sleep 1
        done
    restart: unless-stopped

  # New 'api' tenant — it has no dummy-app of its own; its logs exist only via
  # nginx and are shipped by alloy-nginx with tenant_id=api.
  traffic-api:
    image: curlimages/curl:8.11.1
    container_name: traffic-api
    depends_on:
      dummy-nginx:
        condition: service_started
    networks: [federated]
    command:
      - sh
      - -c
      - |
        i=0
        while true; do
          i=$$((i+1))
          curl -s -o /dev/null "http://dummy-nginx:8080/api/handle?iter=$$i"
          sleep 1
        done
    restart: unless-stopped

  # 9. Grafana Alloy for the nginx logs: tails the three per-tenant access-log
  #    files and ships each to the writer under its tenant (platform/data/api).
  alloy-nginx:
    image: grafana/alloy:latest
    container_name: alloy-logs-nginx
    depends_on:
      gigapipe-writer:
        condition: service_started
      dummy-nginx:
        condition: service_started
    networks: [federated]
    volumes:
      - ./alloy/config-nginx.alloy:/etc/alloy/config.alloy:ro
      - nginxlogs:/var/log/nginx:ro
      - alloydata:/var/lib/alloy/data
    ports:
      # Alloy's own debug UI on host 0.0.0.0:12347.
      - "12347:12345"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    restart: unless-stopped
