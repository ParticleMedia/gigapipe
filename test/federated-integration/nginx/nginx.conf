# Dummy "log generator" nginx.
#
# It accepts every request, discards the traffic (returns 204 No Content and
# proxies nowhere — the request body goes to the bit-bucket), and writes an
# access-log line for each request it received. Those log lines are what the
# rest of the stack consumes.
#
# Requests are attributed to a tenant purely by their URL prefix:
#   /platform/...  -> tenant "platform"
#   /data/...      -> tenant "data"
#   /api/...       -> tenant "api"
# and each tenant's lines are written to its own file under /var/log/nginx so a
# collector can ship each file with the matching X-Scope-OrgID.

user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  # logfmt-style line so downstream parsers can pull key=value fields as labels.
  log_format tenant '$time_iso8601 tenant=$tenant method=$request_method '
                    'uri="$uri" status=$status req_bytes=$request_length '
                    'client=$remote_addr ua="$http_user_agent"';

  # Derive the tenant from the request path — used only for the tenant= field
  # in the log line below. A variable is fine in the log *format*; it must NOT
  # appear in the access_log *path* (see the per-location logs below).
  map $uri $tenant {
    "~^/platform"  platform;
    "~^/data"      data;
    "~^/api"       api;
    default        unknown;
  }

  server {
    listen 8080 default_server;

    # Swallow everything: log the request and return an empty 204. No upstream,
    # so the traffic effectively goes to /dev/null.
    #
    # The access_log path is STATIC per location (not a $variable). A variable
    # in the path makes nginx run URI->filesystem-path mapping during the log
    # phase, which fails a (misleading) existence check against the default
    # /etc/nginx/html root and silently DROPS the log line — so no lines ever
    # reach the files Alloy tails. See nginx trac #1051 / #1841.
    location /platform/ {
      access_log /var/log/nginx/access-platform.log tenant;
      return 204;
    }
    location /data/ {
      access_log /var/log/nginx/access-data.log tenant;
      return 204;
    }
    location /api/ {
      access_log /var/log/nginx/access-api.log tenant;
      return 204;
    }
    # Anything that matches no tenant prefix.
    location / {
      access_log /var/log/nginx/access-unknown.log tenant;
      return 204;
    }
  }
}
